name: Deploy animal classifier to Windows runner

on:
  workflow_run:
    workflows: ["Build and Push Animal Classifier Image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker Hub image tag
        required: false
        default: latest

env:
  IMAGE_NAME: animal-classifier
  CONTAINER_NAME: animal-classifier
  HOST_PORT: '8001'

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Verify Docker environment
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        run: |
          $ErrorActionPreference = 'Stop'
          docker context use desktop-linux
          docker info

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull CI image
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          docker pull $env:IMAGE

      - name: Replace animal classifier container
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $oldImage = ''
          $old = docker ps -aq --filter "name=^/${env:CONTAINER_NAME}$"
          if ($old) { $oldImage = (docker inspect --format '{{.Config.Image}}' $env:CONTAINER_NAME).Trim() }
          $candidate = "$env:CONTAINER_NAME-candidate"
          docker rm -f $candidate 2>$null
          docker run -d --name $candidate -p 127.0.0.1:18001:8000 $env:IMAGE
          $healthy = $false
          1..30 | ForEach-Object {
            if (-not $healthy) {
              curl.exe --silent --show-error --fail --max-time 5 http://127.0.0.1:18001/api/health | Out-Null
              if ($LASTEXITCODE -eq 0) { $healthy = $true } else { Start-Sleep -Seconds 2 }
            }
          }
          if (-not $healthy) { docker logs $candidate; throw 'Candidate health check failed.' }
          if ($old) { docker rm -f $env:CONTAINER_NAME }
          try {
            docker run -d --name $env:CONTAINER_NAME --restart unless-stopped -p "${env:HOST_PORT}:8000" $env:IMAGE
            if ($LASTEXITCODE -ne 0) { throw 'Production container failed to start.' }
            docker rm -f $candidate
          } catch {
            if ($oldImage) { docker rm -f $env:CONTAINER_NAME 2>$null; docker run -d --name $env:CONTAINER_NAME --restart unless-stopped -p "${env:HOST_PORT}:8000" $oldImage }
            throw
          }

      - name: Verify application health and web page
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        run: |
          $ErrorActionPreference = 'Stop'
          $ok = $false
          1..15 | ForEach-Object {
            if (-not $ok) {
              curl.exe --silent --show-error --fail --max-time 10 http://127.0.0.1:8001/api/health | Out-Host
              if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 2 }
            }
          }
          if (-not $ok) { docker ps -a; docker logs --tail 200 $env:CONTAINER_NAME; throw 'Health check failed.' }
          curl.exe --silent --show-error --fail --max-time 10 http://127.0.0.1:8001/ | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Web page check failed.' }

      - name: Monitor after deployment and write Summary
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'deployment-results'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $csv = Join-Path $dir 'health-monitor.csv'
          'sequence,start,end,status,response_ms,version,result' | Set-Content $csv -Encoding UTF8
          $ok = 0; $times = @(); $first = ''; $last = ''
          1..30 | ForEach-Object {
            $start = Get-Date; $status = 'ERROR'; $version = ''; $result = 'error'
            try { $body = curl.exe --silent --show-error --fail --max-time 5 http://127.0.0.1:8001/api/health; if ($LASTEXITCODE -eq 0) { $p = $body | ConvertFrom-Json; $status = '200'; $version = [string]$p.model_version; $result = if ($version -eq '2.0') { 'ok' } else { 'wrong-version' } } } catch {}
            $end = Get-Date; $ms = [math]::Round(($end-$start).TotalMilliseconds,2); $times += $ms; if ($result -eq 'ok') { $ok++ }
            if (-not $first) { $first = "$status / v$version / $result" }; $last = "$status / v$version / $result"
            "$($_),$($start.ToString('o')),$($end.ToString('o')),$status,$ms,$version,$result" | Add-Content $csv -Encoding UTF8
            Write-Host "request=$($_) status=$status version=$version ms=$ms result=$result"
            if ($_ -lt 30) { Start-Sleep -Seconds 1 }
          }
          $avg = if ($times.Count) { [math]::Round(($times | Measure-Object -Average).Average,2) } else { 0 }
          $max = if ($times.Count) { ($times | Measure-Object -Maximum).Maximum } else { 0 }
          $final = if ($ok -eq 30) { 'SUCCESS' } else { 'FAILED' }
          @"
          ## Animal Classifier deployment verification
          **Result:** $final
          **Stable URL:** http://127.0.0.1:8001/
          **After observation:** 30 requests at 1-second intervals
          **Final version:** v2.0

          | Stage | Requests (ok/total) | Representative request | HTTP | Analysis | Response version | Result |
          |---|---:|---:|---:|---|---|---|
          | Before | Not measured | Not measured | N/A | N/A | N/A | Not measured |
          | During | Not measured | Not measured | N/A | N/A | N/A | Not measured |
          | After | $ok/30 | #1: $first; #30: $last | 200 | True | v2.0 | $final |

          Average response: ${avg}ms; maximum response: ${max}ms. Before/During were not measured by this workflow.
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animal-classifier-deployment-results
          path: deployment-results
          if-no-files-found: warn

      - name: Log out of Docker Hub
        if: always()
        continue-on-error: true
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        run: docker logout
