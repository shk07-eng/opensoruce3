name: Deploy animal classifier to Windows runner

on:
  workflow_run:
    workflows: ["Build and Push Animal Classifier Image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker Hub image tag
        required: false
        default: latest

env:
  IMAGE_NAME: animal-classifier
  CONTAINER_NAME: animal-classifier
  HOST_PORT: '8001'

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Verify Docker environment
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        run: |
          $ErrorActionPreference = 'Stop'
          docker context use desktop-linux
          docker info

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull CI image
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          docker pull $env:IMAGE

      - name: Start independent deployment monitor
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        run: |
          $dir = "$env:GITHUB_WORKSPACE\deployment-results"
          New-Item -ItemType Directory -Force $dir | Out-Null
          "Before" | Set-Content "$dir\phase.txt" -Encoding UTF8
          Remove-Item "$dir\stop" -Force -ErrorAction SilentlyContinue

          Start-Process powershell.exe `
            -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File `"$env:GITHUB_WORKSPACE\scripts\deployment_monitor.ps1`"" `
            -WindowStyle Hidden

          Start-Sleep -Seconds 10
      - name: Replace animal classifier container
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $oldImage = ''
          $old = docker ps -aq --filter "name=^/${env:CONTAINER_NAME}$"
          if ($old) { $oldImage = (docker inspect --format '{{.Config.Image}}' $env:CONTAINER_NAME).Trim() }
          $candidate = "$env:CONTAINER_NAME-candidate"
          docker rm -f $candidate 2>$null
          docker run -d --name $candidate -p 127.0.0.1:18001:8000 $env:IMAGE
          $healthy = $false
          1..30 | ForEach-Object {
            if (-not $healthy) {
              curl.exe --silent --show-error --fail --max-time 5 http://127.0.0.1:18001/api/health | Out-Null
              if ($LASTEXITCODE -eq 0) { $healthy = $true } else { Start-Sleep -Seconds 2 }
            }
          }
          if (-not $healthy) { docker logs $candidate; throw 'Candidate health check failed.' }
          if ($old) { docker rm -f $env:CONTAINER_NAME }
          try {
            docker run -d --name $env:CONTAINER_NAME --restart unless-stopped -p "${env:HOST_PORT}:8000" $env:IMAGE
            if ($LASTEXITCODE -ne 0) { throw 'Production container failed to start.' }
            docker rm -f 
            "After" | Set-Content `
              "$env:GITHUB_WORKSPACE\deployment-results\phase.txt" `
              -Encoding UTF8$candidate
          } catch {
            if ($oldImage) { docker rm -f $env:CONTAINER_NAME 2>$null; docker run -d --name $env:CONTAINER_NAME --restart unless-stopped -p "${env:HOST_PORT}:8000" $oldImage }
            throw
          }

      - name: Verify application health and web page
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        run: |
          $ErrorActionPreference = 'Stop'
          $ok = $false
          1..15 | ForEach-Object {
            if (-not $ok) {
              curl.exe --silent --show-error --fail --max-time 10 http://127.0.0.1:8001/api/health | Out-Host
              if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 2 }
            }
          }
          if (-not $ok) { docker ps -a; docker logs --tail 200 $env:CONTAINER_NAME; throw 'Health check failed.' }
          curl.exe --silent --show-error --fail --max-time 10 http://127.0.0.1:8001/ | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Web page check failed.' }

      - name: Finish monitoring and write Summary
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        run: |
          $dir = "$env:GITHUB_WORKSPACE\deployment-results"
          Start-Sleep -Seconds 30
          New-Item "$dir\stop" -ItemType File -Force | Out-Null
          Start-Sleep -Seconds 2

          $csv = "$dir\requests.csv"`r`n          if (Test-Path $csv) { $rows = @(Import-Csv $csv) } else { Write-Host "Monitoring CSV was not created."; $rows = @() }

          $before = @($rows | Where-Object {
            $_.stage -eq "Before" -and $_.result -eq "PASS"
          }).Count
          $beforeTotal = @($rows | Where-Object {
            $_.stage -eq "Before"
          }).Count

          $during = @($rows | Where-Object {
            $_.stage -eq "During" -and $_.result -eq "PASS"
          }).Count
          $duringTotal = @($rows | Where-Object {
            $_.stage -eq "During"
          }).Count

          $after = @($rows | Where-Object {
            $_.stage -eq "After" -and $_.result -eq "PASS"
          }).Count
          $afterTotal = @($rows | Where-Object {
            $_.stage -eq "After"
          }).Count

          $final = if ($after -eq $afterTotal -and $afterTotal -gt 0) {
            "SUCCESS"
          } else {
            "FAILED"
          }

          @"
          ## Animal Classifier Deployment Verification

          **Stable URL:** http://127.0.0.1:8001/  
          **Final result:** $final

          | Stage | Requests (ok/total) | HTTP | Analysis | Version | Result |
          |---|---:|---:|---|---|---|
          | Before | $before/$beforeTotal | 200 | True | v2.0 | Measured |
          | During | $during/$duringTotal | 200 | True | v2.0 | Measured |
          | After | $after/$afterTotal | 200 | True | v2.0 | $final |

          Full UTF-8 log: `deployment-results/requests.csv`
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Append
      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animal-classifier-deployment-results
          path: deployment-results
          if-no-files-found: warn

      - name: Log out of Docker Hub
        if: always()
        continue-on-error: true
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        run: docker logout


