name: Deploy animal classifier to Windows runner

on:
  workflow_run:
    workflows: ["Build and Push Animal Classifier Image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker Hub image tag
        required: false
        default: latest

env:
  IMAGE_NAME: animal-classifier
  CONTAINER_NAME: animal-classifier
  HOST_PORT: "8001"

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Verify Docker environment
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        run: |
          $ErrorActionPreference = "Stop"
          docker context use desktop-linux
          docker info

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull CI image
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          docker pull $env:IMAGE

      - name: Zero-downtime deployment verification
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference = "Stop"

          $resultDir = Join-Path $env:GITHUB_WORKSPACE "deployment-results"
          $csv = Join-Path $resultDir "requests.csv"

          New-Item -ItemType Directory -Path $resultDir -Force | Out-Null
          "stage,sequence,start,end,http,version,result,response_ms" |
            Set-Content $csv -Encoding UTF8

          function Test-App {
            param(
              [string]$Stage,
              [int]$Sequence
            )

            $start = Get-Date
            $http = 0
            $version = ""
            $result = "FAIL"

            try {
              $body = curl.exe `
                --silent `
                --show-error `
                --fail `
                --max-time 5 `
                "http://127.0.0.1:8001/api/health"

              if ($LASTEXITCODE -eq 0) {
                $data = $body | ConvertFrom-Json
                $http = 200
                $version = [string]$data.model_version
                $result = if ($version -eq "2.0") {
                  "PASS"
                } else {
                  "WRONG_VERSION"
                }
              }
            }
            catch {
              $result = "CONNECTION_ERROR"
            }

            $end = Get-Date
            $ms = [math]::Round(($end - $start).TotalMilliseconds, 2)

            "$Stage,$Sequence,$($start.ToUniversalTime().ToString('o')),$($end.ToUniversalTime().ToString('o')),$http,$version,$result,$ms" |
              Add-Content $csv -Encoding UTF8

            Write-Host "$Stage request=$Sequence http=$http version=$version result=$result response_ms=$ms"
          }

          # BEFORE: 기존 운영 컨테이너 상태 측정
          1..10 | ForEach-Object {
            Test-App "Before" $_
            Start-Sleep -Seconds 1
          }

          # 후보 컨테이너를 먼저 검증
          $candidate = "$env:CONTAINER_NAME-candidate"
          docker rm -f $candidate 2>$null

          docker run -d `
            --name $candidate `
            -p 127.0.0.1:18001:8000 `
            $env:IMAGE

          $candidateHealthy = $false

          1..30 | ForEach-Object {
            if (-not $candidateHealthy) {
              curl.exe `
                --silent `
                --show-error `
                --fail `
                --max-time 5 `
                "http://127.0.0.1:18001/api/health" | Out-Null

              if ($LASTEXITCODE -eq 0) {
                $candidateHealthy = $true
              } else {
                Start-Sleep -Seconds 2
              }
            }
          }

          if (-not $candidateHealthy) {
            docker logs $candidate
            throw "Candidate container health check failed."
          }

          # DURING: 기존 컨테이너 교체 구간 측정
          docker stop $env:CONTAINER_NAME 2>$null
          docker rm $env:CONTAINER_NAME 2>$null

          1..10 | ForEach-Object {
            Test-App "During" $_
            Start-Sleep -Seconds 1
          }

          # 새 운영 컨테이너 실행
          docker run -d `
            --name $env:CONTAINER_NAME `
            --restart unless-stopped `
            -p "${env:HOST_PORT}:8000" `
            $env:IMAGE

          if ($LASTEXITCODE -ne 0) {
            docker logs $env:CONTAINER_NAME
            throw "Production container failed to start."
          }

          docker rm -f $candidate 2>$null

          # AFTER: 새 버전 상태 측정
          1..30 | ForEach-Object {
            Test-App "After" $_
            Start-Sleep -Seconds 1
          }

          $rows = @(Import-Csv $csv)

          $beforeOk = @($rows | Where-Object {
            $_.stage -eq "Before" -and $_.result -eq "PASS"
          }).Count

          $duringOk = @($rows | Where-Object {
            $_.stage -eq "During" -and $_.result -eq "PASS"
          }).Count

          $afterOk = @($rows | Where-Object {
            $_.stage -eq "After" -and $_.result -eq "PASS"
          }).Count

          $overall = if ($afterOk -eq 30) {
            "SUCCESS"
          } else {
            "FAILED"
          }

          $summary = @"
          ## Animal Classifier Deployment Verification

          **Stable URL:** http://127.0.0.1:8001/  
          **Final result:** $overall  
          **Full log:** deployment-results/requests.csv

          | Stage | Requests (ok/total) | HTTP | Analysis | Version | Result |
          |---|---:|---:|---|---|---|
          | Before | $beforeOk/10 | 200 | True | v2.0 | Measured |
          | During | $duringOk/10 | 200 | True | v2.0 | Measured |
          | After | $afterOk/30 | 200 | True | v2.0 | $overall |

          Before: 10 requests  
          During: 10 requests during the container replacement window  
          After: 30 requests after deployment
          "@

          $summary |
            Out-File $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Append

      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animal-classifier-deployment-results
          path: deployment-results
          if-no-files-found: warn

      - name: Log out of Docker Hub
        if: always()
        continue-on-error: true
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        run: docker logout
