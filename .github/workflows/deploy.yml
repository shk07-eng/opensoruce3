          if (-not $healthy) { docker logs $candidate; throw 'Candidate health check failed; existing container was preserved.' }
          if ($oldExists) { docker rm -f $env:CONTAINER_NAME }
          try { docker run -d --name $env:CONTAINER_NAME --restart unless-stopped -p "${env:HOST_PORT}:8000" $env:IMAGE; if ($LASTEXITCODE -ne 0) {throw 'Production container failed to start.'}; docker rm -f $candidate } catch { if ($oldImage) { docker rm -f $env:CONTAINER_NAME 2>$null; docker run -d --name $env:CONTAINER_NAME --restart unless-stopped -p "${env:HOST_PORT}:8000" $oldImage }; throw }
      - name: Verify application health and web page
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        run: |
          $ErrorActionPreference='Stop'; $health=Invoke-WebRequest http://127.0.0.1:8001/api/health -UseBasicParsing -TimeoutSec 10; if ($health.StatusCode -ne 200) {throw 'Health check failed'}; $page=Invoke-WebRequest http://127.0.0.1:8001/ -UseBasicParsing -TimeoutSec 10; if ($page.StatusCode -ne 200) {throw 'Web page check failed'}; Write-Host 'Animal classifier deployment is healthy.'
      - name: Monitor deployed service and write Summary
        id: monitor
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        run: |
          $ErrorActionPreference='Continue'
          $dir=Join-Path $env:GITHUB_WORKSPACE 'deployment-results'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $csv=Join-Path $dir 'health-monitor.csv'
          'sequence,start,end,status,response_ms,version,result' | Set-Content $csv -Encoding UTF8
          $ok=0; $failed=0; $times=@(); $first=''; $last=''; $monitorStart=Get-Date
          1..30 | ForEach-Object {
            $start=Get-Date; $status='ERROR'; $version=''; $result='error'
            try { $r=Invoke-RestMethod 'http://127.0.0.1:8001/api/health' -TimeoutSec 5; $status='200'; $version=[string]$r.model_version; $result=if($version -eq '2.0'){'ok'}else{'wrong-version'}; if($result -eq 'ok'){$ok++}else{$failed++} } catch {$failed++}
            $end=Get-Date; $ms=[math]::Round(($end-$start).TotalMilliseconds,2); $times += $ms
            if(-not $first){$first="$status / v$version / $result"}; $last="$status / v$version / $result"
            "$($_),$($start.ToString('o')),$($end.ToString('o')),$status,$ms,$version,$result" | Add-Content $csv -Encoding UTF8
            Write-Host "monitor request $($_): $status version=$version ${ms}ms result=$result"
            if($_ -lt 30){Start-Sleep -Seconds 1}
          }
          $max=if($times.Count){($times | Measure-Object -Maximum).Maximum}else{0}
          $avg=if($times.Count){[math]::Round(($times | Measure-Object -Average).Average,2)}else{0}
          $result=if($failed -eq 0 -and $ok -eq 30){'SUCCESS'}else{'FAILED'}
          $summary=@"
          ## Personal Expense Tracker / Animal Classifier Deployment Summary
          | Item | Result |
          |---|---|
          | Verification URL | http://127.0.0.1:8001 |
          | Observation window | $($monitorStart.ToString('o')) - $((Get-Date).ToString('o')) |
          | Before deployment | Not observed by this workflow |
          | During deployment | Not observed by this workflow |
          | After deployment | 30 requests at 1-second intervals |
          | Requests (ok/total) | $ok/30 |
          | Failed requests | $failed |
          | Response version | v2.0 expected; first=$first; last=$last |
          | Average response time | ${avg}ms |
          | Maximum response time | ${max}ms |
          | Final result | $result |

          The no-interruption statement is limited to the observed post-deployment request window. Unobserved Before/During intervals are not claimed as zero-downtime.
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Post Log in to Docker Hub
        if: always()
        continue-on-error: true
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        run: docker logout
      - name: Upload deployment logs and Summary data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animal-classifier-deployment-results
          path: deployment-results
          if-no-files-found: warn
.Exception.Message)"
