name: Build and Push Animal Classifier Image

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE_NAME: animal-classifier
  IMAGE_REPO: ${{ github.event_name == 'push' && secrets.DOCKERHUB_USERNAME || 'local' }}

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and model dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu -r requirements-model.txt
      - name: Verify ResNet18 CPU model loading
        run: |
          python -m compileall -q app
          python -c "from app.main import model, preprocess; import torch; y=model(torch.zeros(1,3,224,224)); assert tuple(y.shape)==(1,1000); print('model load and CPU inference: OK')"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_REPO }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
