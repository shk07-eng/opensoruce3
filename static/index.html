<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>동물 종류 판별기</title><link rel="stylesheet" href="/static/style.css"></head><body><main><header><span class="tag">AI IMAGE CLASSIFIER</span><h1>동물 종류 판별기</h1><p>이미지를 업로드하면 CPU에서 실행되는 사전학습 모델이 비슷한 대상을 추정합니다.</p></header><section class="card"><label class="drop" for="file"><input id="file" type="file" accept="image/*"><span>📷 이미지를 선택하세요</span><small>JPG · PNG · WEBP / 최대 10MB</small></label><div id="previewWrap" class="preview hidden"><img id="preview" alt="선택한 이미지 미리보기"></div><button id="analyze" disabled>이미지 분석하기</button><p id="error" class="error"></p></section><section id="result" class="card hidden"><h2>분석 결과 <span class="estimate">추정 결과</span></h2><div id="predictions"></div><p class="notice"></p></section><footer>ResNet-18 · ImageNet · 모든 결과는 참고용 추정치입니다.</footer></main><script src="/static/app.js"></script></body></html>
